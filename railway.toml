# Railway service config for CitizenAsk.
#
# Unlike GoFetch, this repo has no demo/ subdirectory split -- the Dockerfile
# lives at the repo root and the service's "Root Directory" setting should
# stay unset (repo root), matching dockerfilePath below.
#
# Required environment variables for a real deployment:
#   - OPENAI_API_KEY: needed for structured-query planning and answer
#     generation (generation/llm.py). Without it, the app now starts and
#     /health still reports 200 (see api/dependencies.py's graceful
#     degradation), but /query fails at request time on any dataset match
#     with a clear "OPENAI_API_KEY is not set" error instead of a silent
#     failure or a startup crash.
#   - DATABASE_URL: pgvector-enabled Postgres connection string for the RAG
#     fallback over document-shaped datasets (rag/retriever.py). Without it,
#     /health reports rag_available: false and RAG-routed questions abstain
#     with a "document search is temporarily unavailable" message instead of
#     crashing (api/dependencies.py::_try_create_pool degrades gracefully).
#
# Known gaps, flagged rather than solved here:
#   - This repo doesn't stand up Postgres as part of its own deploy -- a
#     pgvector-enabled Postgres instance is provisioned as a separate
#     Railway service, and its connection string is wired in as DATABASE_URL.
#   - The RAG document corpus under data/ needs a one-time ingestion run
#     against that Postgres instance before RAG answers will have any
#     content to retrieve: `uv run python -m scripts.ingest` (see README's
#     "Ingesting the RAG document corpus"). This is not part of container
#     startup and is not automated by this config.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
